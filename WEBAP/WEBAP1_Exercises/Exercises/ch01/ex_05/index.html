<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Exercise 1.5</title>
    <link rel="stylesheet" href="../../../assets/exercise.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function () {
            $("#name").on("input", function () {
                let name = $(this).val().trim();
                if (name === "") {
                    $("#summary").prop("disabled", true);
                } else {
                    $("#summary").prop("disabled", false);
                }
            });

            $("#summary").click(function () {
                let name = $("#name").val();
                let email = $("#email").val();
                let schoolClass = $("#class").val();
                let languageChoice = $("input[name='language']:checked").val();
                let remarks = $("#remarks").val();
                let newsletter = "";
                $("#output").html("");

                if (!email) $("#output").append("<li class='error'>Please enter an email</li>");
                if (!schoolClass) $("#output").append("<li class='error'>Please select a class</li>");

                if ($("#newsletter").is(":checked")) {
                    newsletter = "✓"
                } else {
                    newsletter = "✖";
                }
                
                if (email && schoolClass && languageChoice) {
                    switch (languageChoice) {
                        case "EN": $("#output").append("<li>Name: " + name + "</li>");
                                   $("#output").append("<li>Email: " + email + "</li>");
                                   $("#output").append("<li>Class: " + schoolClass + "</li>");
                                   $("#output").append("<li>Preferred language: English</li>");
                                   $("#output").append("<li>Receive newsletter: " + newsletter + "</li>");
                                   if (remarks) $("#output").append("<li>Remarks: " + remarks + "</li>");  
                        break;
                        case "FR": $("#output").append("<li>Nom: " + name + "</li>");
                                   $("#output").append("<li>Email: " + email + "</li>");
                                   $("#output").append("<li>Classe: " + schoolClass + "</li>");
                                   $("#output").append("<li>Langue préférée: Français</li>");
                                   $("#output").append("<li>S'abonner aux actualités: " + newsletter + "</li>");
                                   if (remarks) $("#output").append("<li>Remarks: " + remarks + "</li>");  
                        break;
                        case "DE": $("#output").append("<li>Name: " + name + "</li>");
                                   $("#output").append("<li>Email: " + email + "</li>");
                                   $("#output").append("<li>Klasse: " + schoolClass + "</li>");
                                   $("#output").append("<li>Präferierte Sprache: Deutsch</li>");
                                   $("#output").append("<li>Nachrichten Abonnement: " + newsletter + "</li>");
                                   if (remarks) $("#output").append("<li>Bemerkung: " + remarks + "</li>");  
                        break;
                    }
                }



            });
            // TODO: #summary: display all values in the list #output

            // TODO: enable/disable #summary depending on the name field (event input)

            // TODO: #reset: clear all fields and the list

            $("#reset").click(function() {
                $("#name").val("");
                $("#summary").prop("disabled", true);
                $("#email").val("");
                $('#class option[value=""]').prop('selected', true);
                $("input:radio[value=EN]").prop("checked", true);
                $('#newsletter').prop('checked', false);
                $("#remarks").val("");;
                $("#output").html("");
            });
        });
    </script>
</head>

<body>
    <h2>Exercise 1.5 – Registration</h2>
    <form id="registration">
        <p><label>Name: <input type="text" id="name"></label></p>
        <p><label>E-mail: <input type="email" id="email"></label></p>
        <p>
            <label>Class:
                <select id="class">
                    <option value="" disabled selected>– please select –</option>
                    <option value="1TPIF">1TPIF</option>
                    <option value="2TPIF">2TPIF</option>
                    <option value="3TPIF">3TPIF</option>
                </select>
            </label>
        </p>
        <p>
            Preferred language:
            <label><input type="radio" name="language" value="EN" checked> English</label>
            <label><input type="radio" name="language" value="FR"> French</label>
            <label><input type="radio" name="language" value="DE"> German</label>
        </p>
        <p><label><input type="checkbox" id="newsletter" value="yes"> I want to receive the newsletter</label></p>
        <p><label>Remarks:<br><textarea id="remarks" rows="3" cols="40"></textarea></label></p>
        <p>
            <button type="button" id="summary" disabled>Show summary</button>
            <button type="button" id="reset">Reset</button>
        </p>
    </form>
    <ul id="output"></ul>
</body>

</html>
